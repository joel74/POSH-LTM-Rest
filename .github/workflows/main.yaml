name: Publish to PowerShell Gallery

on:
  push:
    branches:
      - main
    paths:
      - 'F5-LTM/**'       # Path to your module source code
      - 'F5-LTM/**.psd1'      # Path to your module manifest

jobs:
  publish:
    runs-on: ubuntu-latest  # Modern, lightweight, cross-platform runner

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4  # Latest checkout action

      - name: Publish Module
        shell: pwsh
        env:
          # Injecting the secret as an environment variable is more secure
          PSGALLERY_API_KEY: ${{ secrets.PS_GALLERY_API }} 
        run: |
          # 1. (Optional) Force modern security protocol if needed
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          
          # 2. Publish using the environment variable
          Publish-Module -Path "./src/F5-LTM" -Repository "PSGallery" -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose
