name: Publish to PowerShell Gallery

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest  # Modern, lightweight, cross-platform runner

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6  # Latest checkout action

      - name: Invoke-ScriptAnalyzer
        run: |
          $result = Invoke-ScriptAnalyzer -Path .\F5-LTM -Recurse -Severity Error;
          if ($result.Count -ne 0) { 
            foreach ($singleError in $result) {
              Write-Error $singleError.Message
            }
          }
        shell: pwsh

      - name: Publish Module
        shell: pwsh
        env:
          # Injecting the secret as an environment variable is more secure
          PSGALLERY_API_KEY: ${{ secrets.PS_GALLERY_API }} 
        run: |
          # 1. (Optional) Force modern security protocol if needed
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          
          # 2. Publish using the environment variable
          Publish-Module -Path "./F5-LTM" -Repository "PSGallery" -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose
